[build]
  # public/ enthält die statischen Dateien (Stylesheets, Logos, robots.txt,
  # Favicon) und – nach dem Build – die vorgerenderte Startseite samt
  # Rechtstexten. Alles andere rendert die Express-App in der Function.
  publish = "public"
  # 1. Legt fehlende Tabellen an (idempotent).
  # 2. Rendert Startseite und Rechtstexte als statische HTML-Dateien, damit
  #    diese Aufrufe (und die vielen Bot-Zugriffe darauf) das CDN beantwortet
  #    und nicht die Function – das spart Compute-Credits und lässt die
  #    Datenbank schlafen, solange sich niemand einloggt.
  command = "node src/cli/migrate.js && node src/cli/prerender.js"

[build.environment]
  NODE_VERSION = "22"
  # Netlify sucht als „geheim“ markierte Werte im Build-Ergebnis. Port 3306,
  # Hostname und Benutzername sind keine Geheimnisse – der Port steht zwangs-
  # läufig im MySQL-Treiber und ließ den Build scheitern. Nur das Passwort
  # bleibt im Scan.
  SECRETS_SCAN_OMIT_KEYS = "SHOP_DB_HOST,SHOP_DB_PORT,SHOP_DB_USER,SHOP_DB_NAME"

[functions]
  node_bundler = "esbuild"
  # Diese Pakete nicht mitbündeln – sie laden Dateien bzw. Module dynamisch
  # und vertragen sich schlecht mit dem Bundler.
  external_node_modules = [
    "express",
    "ejs",
    "pg",
    "pg-native",
    "nodemailer",
    "multer",
    "@netlify/database",
    "mysql2",
  ]
  # Die EJS-Templates gehören ins Function-Bundle, sonst findet Express keine Views.
  # Stylesheets und landing.js kommen mit, obwohl sie das CDN ausliefert: Die
  # Function berechnet daraus die Versionskennung für <link>/<script>.
  included_files = ["src/views/**", "src/schema.sql", "public/*.css", "public/*.js"]

# Sicherheitsläufe um 10:30 und 17:30 Europe/Berlin.
#
# Der eigentliche Dashboard-Stand entsteht direkt nach jedem Upload der
# Bestellungen im Adminbereich. Die Läufe hier greifen nur, wenn ein Upload
# ohne Aktualisierung geblieben ist oder heute noch kein Stand existiert.
#
# Netlify plant ausschließlich in UTC. Je Slot gibt es deshalb zwei Termine:
#   10:30 Uhr → 08:30 UTC (Sommerzeit) und 09:30 UTC (Winterzeit)
#   17:30 Uhr → 15:30 UTC (Sommerzeit) und 16:30 UTC (Winterzeit)
# Die Function prüft selbst, ob in Europe/Berlin gerade ein Slot ist, und
# beendet sich sonst, bevor sie die Datenbank anfasst. Die Uhrzeiten lassen
# sich über REFRESH_TIMES ändern – dann müssen die Termine hier mitziehen.
[functions."snapshot"]
  schedule = "30 8 * * *"

[functions."snapshot-winter"]
  schedule = "30 9 * * *"

[functions."snapshot-pm"]
  schedule = "30 15 * * *"

[functions."snapshot-pm-winter"]
  schedule = "30 16 * * *"

# --- Bot-Rauschen abfangen ------------------------------------------------------
# Scanner probieren auf jeder Domain dieselben Pfade (WordPress, PHP, .env).
# Ohne diese Regeln landet jeder dieser Aufrufe in der Function, die dann eine
# 404-Seite rendert – jedes Mal Compute-Credits. So beantwortet das CDN sie
# direkt mit der statischen 404-Seite. Regeln gelten in Reihenfolge, deshalb
# stehen sie VOR dem Catch-all zur Function.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env.*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.aws/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/cgi-bin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/index.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/config.php"
  to = "/404.html"
  status = 404

# Alles, was keine vorhandene statische Datei ist, geht an die Express-App.
# (Ohne force = true haben vorhandene Dateien in public/ Vorrang – so kommen
# Startseite, Rechtstexte, robots.txt und Favicon vom CDN.)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

# Sicherheits-Header für die statisch ausgelieferten Seiten – dieselben Werte,
# die die Function für ihre Antworten setzt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"
